services:
  postgres:
    image: postgres:16-alpine
    container_name: greenhouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greenhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenhouse}
      POSTGRES_DB: ${POSTGRES_DB:-greenhouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - greenhouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-greenhouse} -d ${POSTGRES_DB:-greenhouse}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-greenhouse}:${POSTGRES_PASSWORD:-greenhouse}@postgres:5432/${POSTGRES_DB:-greenhouse}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:5173
      # Optional. Leave empty to run without a broker (the course demo).
      # With the mqtt profile up, use mqtt://mosquitto:1883.
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-}
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  # Optional MQTT broker. Not started by a normal `docker compose up`.
  # Start it with: docker compose --profile mqtt up -d mosquitto
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: greenhouse-mosquitto
    profiles: ["mqtt"]
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

volumes:
  greenhouse_pgdata:
  frontend_node_modules:
  mosquitto_data: